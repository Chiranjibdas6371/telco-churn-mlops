
name: Telco Churn MLOps Workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================
  # CONTINUOUS INTEGRATION
  # =========================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python Files
        run: |
          python -m py_compile app.py
          python -m py_compile src/data/data_ingestion.py
          python -m py_compile src/data/processing.py
          python -m py_compile src/model/model_building.py
          python -m py_compile src/model/model_evaluation.py
          python -m py_compile src/model/register_model.py

      - name: Run Unit Tests
        run: pytest -q


  # =========================
  # CONTINUOUS DELIVERY
  # Build and push to Amazon ECR
  # =========================
  build-and-push-ecr-image:
    name: Build and Push Docker Image
    needs: integration
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker tag \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"


  # =========================
  # CONTINUOUS DEPLOYMENT
  # Deploy to EC2 self-hosted runner
  # =========================
  continuous-deployment:
    name: Deploy to EC2
    needs: build-and-push-ecr-image
    if: github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull New Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Stop Previous Container
        run: |
          docker stop telco-churn-app || true
          docker rm telco-churn-app || true

      - name: Start New Container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run -d \
            --restart unless-stopped \
            -p 8000:8000 \
            --name telco-churn-app \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Verify Deployment
        run: |
          sleep 5
          docker ps --filter name=telco-churn-app
          docker logs telco-churn-app --tail 50
          curl --fail --retry 5 --retry-delay 3 \
            http://127.0.0.1:8000/health

      - name: Clean Up Old Images
        if: success()
        run: |
          docker image prune -f
